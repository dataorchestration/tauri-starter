# Manual app-bundle build (unsigned). Kept out of CI on purpose: a Tauri
# release build takes many minutes per OS, and macOS runner minutes bill at
# 10x on the free plan. Run it from the Actions tab → "Build app" → Run
# workflow and tick the platforms you need; unticked ones never start a runner.
name: Build app

on:
  workflow_dispatch:
    inputs:
      macos:
        description: Build macOS (.app)
        type: boolean
        default: true
      windows:
        description: Build Windows (NSIS .exe)
        type: boolean
        default: false
      linux:
        description: Build Linux (.deb)
        type: boolean
        default: false

jobs:
  macos:
    if: inputs.macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tauri build -- --bundles app
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

  windows:
    if: inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # SQLCipher's vendored OpenSSL needs perl + nasm on MSVC.
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    if: inputs.linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build deps (webkit2gtk, appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tauri build -- --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-linux
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
