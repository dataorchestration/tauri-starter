# Push/PR CI, kept deliberately cheap for the GitHub free plan: nothing here
# compiles Rust. One Linux runner (1x minutes) runs the frontend tests + build
# and `cargo fmt --check` (parses only, no build).
#
# Anything that compiles the crate is manual (Actions tab → Run workflow):
#   rust-checks.yml   cargo clippy -D warnings + cargo test
#   build.yml         app bundle (tauri build)
# Run the full gate locally before merging (see CLAUDE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Frontend + Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Frontend unit tests
        run: npm run test
      - name: Frontend production build
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
