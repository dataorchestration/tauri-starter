# The verification gate, on every platform the app ships to. Mirrors the local
# `npm run check`. App bundle builds are NOT run here (many minutes per OS,
# and macOS minutes bill at 10x on the free plan) — use the manual
# "Build app" workflow (build.yml) when you need installers.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-14 }
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps (webkit2gtk, appindicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # SQLCipher's vendored OpenSSL needs perl + nasm on MSVC.
      - name: Windows build deps (nasm)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --- Frontend ---
      - name: Frontend tests
        run: npm run test
      - name: Frontend build
        run: npm run build

      # --- Rust core ---
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets
