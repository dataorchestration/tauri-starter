# The verification gate, on every platform the app ships to. Mirrors the local
# `npm run check` + an app bundle build (see CLAUDE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-14, bundles: app }
          - { name: Windows, os: windows-latest, bundles: nsis }
          - { name: Linux, os: ubuntu-22.04, bundles: deb }
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps (webkit2gtk, appindicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # SQLCipher's vendored OpenSSL needs perl + nasm on MSVC.
      - name: Windows build deps (nasm)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --- Frontend ---
      - name: Frontend tests
        run: npm run test
      - name: Frontend build
        run: npm run build

      # --- Rust core ---
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

      # --- Integration: unsigned bundle (signing happens in release.yml) ---
      - name: Tauri build
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
